services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: respectudental_app_dev
    restart: unless-stopped
    ports:
      - "3311:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - next_cache:/app/.next
      - ./tmp:/app/tmp
    command: npm run dev

volumes:
  next_cache:
    driver: local

