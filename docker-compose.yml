services:
  db:
    image: mariadb:11.6
    container_name: respectudental_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-respectudental}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - respectudental_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: respectudental_app
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://${MYSQL_USER:-user}:${MYSQL_PASSWORD:-password}@db:3306/${MYSQL_DATABASE:-respectudental}
      - PRISMA_QUERY_ENGINE_LIBRARY=/usr/lib/libssl.so.3
      - PRISMA_CLI_QUERY_ENGINE_TYPE=library
    env_file:
      - .env
    volumes:
      - ./tmp:/app/tmp
      - ./public:/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - respectudental_network
    command: sh -c "node server.js"

  adminer:
    image: adminer:latest
    container_name: respectudental_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - respectudental_network

volumes:
  db_data:
    driver: local

networks:
  respectudental_network:
    driver: bridge